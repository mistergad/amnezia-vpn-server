<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <div class="noise"></div>
  <header class="nav shell">
    <a class="brand" href="/">
      <span class="brand-mark">A</span>
      <span>{{ app_name }}</span>
    </a>
    <nav>
      {% if current_user %}
        <span class="muted nav-email">{{ current_user.email }}</span>
        <a href="{{ '/admin' if current_user.role.value == 'admin' else '/app' }}">Кабинет</a>
        <form class="inline" action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="link-button" type="submit">Выйти</button>
        </form>
      {% else %}
        <a href="/login">Войти</a>
        <a class="button small" href="/register">Начать</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="shell footer">
    <span>{{ app_name }}</span>
    <span class="muted">Защищенное подключение на базе AmneziaWG</span>
  </footer>
  <script>
  document.addEventListener('submit', function (event) {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.matches('[data-long-operation]')) return;
    if (form.dataset.submitting === 'true') {
      event.preventDefault();
      return;
    }
    form.dataset.submitting = 'true';
    form.setAttribute('aria-busy', 'true');
    const button = event.submitter || form.querySelector('button[type="submit"]');
    if (button) {
      button.disabled = true;
      button.classList.add('is-busy');
      button.textContent = form.dataset.busyLabel || 'Выполняется…';
    }
  });
  </script>
</body>
</html>
